<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blogify - Create Post</title>

  <!-- HTML + CSS together -->
  <style>
    /* Basic Reset */
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
    body{
      background:#f9f9fc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px
    }
    .container{
      width: min(720px, 100%);background:#fff;border-radius:14px;padding:20px 18px;
      box-shadow:0 8px 24px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.06)
    }
    .heading{font-size:18px;color:#555;margin-bottom:10px}
    .title-input{
      width:100%;border:none;outline:none;font-size:20px;font-weight:600;color:#333;
      padding:10px 6px;border-bottom:1px solid #eee;margin-bottom:14px
    }
    .editor{border:1px solid #e7e7e7;border-radius:10px;overflow:hidden;background:#fff}
    .toolbar{
      display:flex;gap:8px;align-items:center;padding:8px 10px;background:#f4f4f7;border-bottom:1px solid #e7e7e7
    }
    .tb-btn{
      border:none;background:transparent;cursor:pointer;font-size:14px;padding:6px 10px;border-radius:8px
    }
    .tb-btn:hover{background:#ececf6}
    textarea{
      width:100%;min-height:240px;border:none;outline:none;resize:none;padding:12px 14px;font-size:15px;line-height:1.6;color:#222
    }
    textarea::placeholder{color:#9aa0a6}
    .actions{
      margin-top:14px;display:flex;gap:10px;justify-content:flex-end
    }
    .btn{
      border:none;cursor:pointer;padding:9px 16px;border-radius:10px;font-size:14px
    }
    .btn.save{background:#f1f1f4;color:#444}
    .btn.publish{background:#5a4ff7;color:#fff}
  </style>
</head>
<body>
  <div class="container">
    <div class="heading">Your Post Title...</div>
    <input class="title-input" type="text" placeholder="Give your post a catchy title..." />

    <div class="editor">
      <div class="toolbar">
        <button class="tb-btn"><b>B</b></button>
        <button class="tb-btn"><i>I</i></button>
        <button class="tb-btn"><u>U</u></button>
        <button class="tb-btn">A-</button>
        <button class="tb-btn">A+</button>
        <button class="tb-btn" title="More">✎</button>
      </div>

      <!-- ✅ Placeholder FIXED (sirf blank hone par dikhega) -->
      <textarea placeholder="Start writing your amazing blog post here..."></textarea>
    </div>

    <div class="actions">
      <button class="btn save">Save Draft</button>
      <button class="btn publish">Publish Post</button>
    </div>
  </div>
</body>
</html>

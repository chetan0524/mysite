<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeraWebsite - Login</title>

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    /* Navbar */
    header {
      background: #1a5bdb;
      color: white;
      padding: 10px 20px;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar .logo {
      font-size: 22px;
    }

    .navbar nav a {
      color: white;
      margin-left: 15px;
      text-decoration: none;
      font-weight: bold;
    }

    .navbar nav a:hover {
      text-decoration: underline;
    }

    /* Login Container */
    .login-container {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background: #f4f4f4;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .login-container label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    .login-container input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .login-container button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: #1a5bdb;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-container button:hover {
      background: #144bb5;
    }

    .signup-text {
      text-align: center;
      margin-top: 15px;
    }

    .signup-text a {
      color: #1a5bdb;
      text-decoration: none;
    }

    /* Footer */
    footer {
      background: #1a5bdb;
      color: white;
      text-align: center;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <header>
    <div class="navbar">
      <h1 class="logo">MeraWebsite</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <!-- Login Box -->
  <div class="login-container">
    <h2>Login</h2>
    <form>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>

      <button type="submit">Login</button>
      <p class="signup-text">Don’t have an account? <a href="#">Sign Up</a></p>
    </form>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2025 MeraWebsite | All rights reserved</p>
  </footer>
</body>
</html>
